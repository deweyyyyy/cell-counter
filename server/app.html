<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6FA">
<title>Cell Counter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 30 30%22%3E%3Crect width=%2230%22 height=%2230%22 rx=%228%22 fill=%22%232E4FB3%22/%3E%3Cpath d=%22M8 8h14v14H8z M15 8v14 M8 15h14%22 stroke=%22white%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F6FA; --surface:#FFFFFF; --ink:#10182B; --ink2:#3A4358; --muted:#5B6478; --faint:#8A93A6;
  --line:#DDE2EC; --line2:#C3CAD8; --trypan:#2E4FB3; --trypan-d:#1F3A8A; --trypan-tint:#E7ECFA; --trypan-tint2:#EEF2FC;
  --good:#0B6B4E; --good-bg:#E3F5EE; --good-line:#C9EBDD; --warn:#8A5300; --warn-bg:#FFF1DC; --bad:#A3361B; --bad-bg:#FDE8E2;
  --manual:#E07A10; --night:#0F1522; --night2:#161E2E; --nline:#2A3449; --nmuted:#A9B2C6;
  --f:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif; --m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --pad:max(16px,env(safe-area-inset-left,0px));
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f);-webkit-text-size-adjust:100%}
body{min-height:100dvh}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--trypan)}
:focus-visible{outline:3px solid var(--trypan);outline-offset:2px}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative}
.screen{min-height:100dvh;display:flex;flex-direction:column}
.dark{background:var(--night);color:#EEF1F7}

/* header */
.top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 8px}
.icon-btn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:0;background:transparent;color:inherit}
.icon-btn.ring{border:1px solid var(--nline)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{color:var(--good);background:var(--good-bg)} .pill.off{color:var(--bad);background:var(--bad-bg)} .pill.blue{color:var(--trypan);background:var(--trypan-tint)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.title-col{flex:1;min-width:0;display:flex;flex-direction:column}
.title-col b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title-col span{font-size:12px;color:var(--muted)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);font-size:15px;font-weight:600;text-decoration:none}
.btn.primary{min-height:56px;border:0;border-radius:16px;background:var(--trypan);color:#fff;font-size:17px}
.btn.primary:active{background:var(--trypan-d)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:default}
.btn[aria-disabled="true"]{pointer-events:none}
.btn.split{justify-content:space-between;padding:0 18px}
.btn .sub{font-size:13px;font-weight:500;opacity:.9;display:inline-flex;align-items:center;gap:4px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.foot{position:sticky;bottom:0;display:flex;flex-direction:column;gap:10px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);margin-top:auto;z-index:2}

/* start */
.start-main{display:flex;flex-direction:column;gap:18px;padding:6px 20px 24px}
h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.legend{font-size:13px;font-weight:600;color:var(--ink2)}
.field input{font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);width:100%;min-width:0}
.field input:focus{border-color:var(--trypan);outline:none;box-shadow:0 0 0 3px var(--trypan-tint)}
.field .hint{font-size:12px;color:var(--muted)}
.field input.mono{font-family:var(--m)}
.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.choice[aria-pressed="true"]{border:2px solid var(--trypan);background:var(--trypan-tint2)}
.choice b{display:block;font-size:16px}.choice span{font-size:12px;color:var(--muted)}
.recent{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.recent a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid #EDF0F5;color:var(--ink);text-decoration:none}
.recent a:first-child{border-top:0}
.recent .nm{display:flex;flex-direction:column;min-width:0}
.recent .nm b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .nm span{font-size:12px;color:var(--muted)}
.recent .v{font-family:var(--m);font-size:14px;font-weight:500;white-space:nowrap}
.empty-note{font-size:13px;color:var(--muted);padding:14px}

/* count */
.slotnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 16px 12px}
.slot{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 9px;border-radius:12px;border:1px dashed var(--line2);background:transparent;min-width:0;min-height:52px}
.slot small{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.slot .n{font-family:var(--m);font-size:15px;font-weight:600;color:var(--faint)}
.slot.done{border:1px solid var(--good-line);background:#EAF7F1}.slot.done small{color:var(--good)}.slot.done .n{color:var(--ink)}
.slot.cur{border:2px solid var(--trypan);background:var(--surface)}.slot.cur small{color:var(--trypan)}.slot.cur .n{color:var(--ink)}
.stage{position:relative;margin:0 16px;border-radius:18px;overflow:hidden;background:var(--night);aspect-ratio:1/1}
.stage canvas{display:block;width:100%;height:100%}
.stage .badge{position:absolute;left:12px;bottom:12px;display:flex;align-items:baseline;gap:6px;background:rgba(12,18,32,.84);color:#fff;padding:8px 14px;border-radius:12px}
.stage .badge b{font-family:var(--m);font-size:30px;font-weight:600;line-height:1}
.stage .meta{position:absolute;right:12px;bottom:12px;font-size:12px;color:#fff;background:rgba(12,18,32,.84);padding:6px 10px;border-radius:10px}
.stage .busy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(12,18,32,.55);color:#fff;font-size:15px}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.shoot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#EEF1F7}
.shoot p{margin:0;font-size:14px;color:var(--nmuted);max-width:30ch}
.shoot .btn.primary{padding:0 24px}
.shoot .ghost{background:transparent;color:#fff;border-color:var(--nline)}
.legend-row{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 20px 0;font-size:12px;color:var(--ink2)}
.legend-row span{display:inline-flex;align-items:center;gap:6px}
.ring-ai{width:10px;height:10px;border-radius:50%;border:2px solid #12936B}
.ring-man{width:10px;height:10px;border-radius:50%;border:2px solid var(--manual)}
.dash{width:14px;border-top:2px dashed #C99A1E}
.notice{margin:10px 16px 0;padding:10px 12px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.info{background:var(--trypan-tint);color:var(--trypan-d)}
.notice button{border:0;background:transparent;color:inherit;font-weight:600;text-decoration:underline;padding:6px 2px;white-space:nowrap}

/* review */
.rv-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 10px}
.rv-head .mid{display:flex;flex-direction:column;align-items:center;min-width:0}
.rv-head .mid b{font-size:15px;font-weight:600}
.rv-head .mid span{font-family:var(--m);font-size:12px;color:var(--nmuted)}
.done-btn{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:12px;border:0;background:#fff;color:var(--night);font-size:15px;font-weight:600}
.rv-stage{position:relative;flex:1;min-height:300px;overflow:hidden;touch-action:none;background:#000}
.rv-stage canvas{position:absolute;inset:0;width:100%;height:100%}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:rgba(12,18,32,.85)}
.zoom button{width:44px;height:44px;border:0;background:transparent;color:#fff;font-size:22px}
.zoom button+button{border-top:1px solid var(--nline)}
.zlabel{position:absolute;left:12px;top:12px;font-family:var(--m);font-size:12px;color:#fff;background:rgba(12,18,32,.85);padding:6px 10px;border-radius:10px}
.hint-chip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(12,18,32,.85);padding:6px 12px;border-radius:999px;white-space:nowrap}
.rv-panel{display:flex;flex-direction:column;gap:14px;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--night2);border-top:1px solid var(--nline)}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--night);padding:4px;border-radius:14px}
.tools button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:10px;background:transparent;color:var(--nmuted);font-size:12px}
.tools button[aria-pressed="true"]{background:var(--manual);color:var(--ink);font-weight:600}
.tools button[data-tool="frame"][aria-pressed="true"]{background:#FFD166}
.tools button[data-tool="pan"][aria-pressed="true"]{background:#fff}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .lab{display:flex;justify-content:space-between;font-size:13px}
.slider .lab label{color:var(--nmuted)}
.slider input{width:100%;accent-color:#7E9BFF;height:28px}
.slider .ends{display:flex;justify-content:space-between;font-size:11px;color:#8590A8}
.recount{min-height:40px;border-radius:10px;border:1px solid var(--nline);background:transparent;color:#fff;font-size:13px;font-weight:600;padding:0 12px}

/* summary */
.sum-main{display:flex;flex-direction:column;gap:14px;padding:4px 16px 16px}
.sum-title{padding:0 4px}
.sum-title h1{font-size:20px;line-height:1.3}
.sum-title span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.big{font-family:var(--m);font-size:38px;font-weight:600;line-height:1.1;color:var(--trypan)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:12px;background:var(--ground);min-width:0}
.stat span{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--m);font-size:17px;font-weight:600}
.stat.good{background:var(--good-bg)}.stat.good span,.stat.good b{color:var(--good)}
.stat.warn{background:var(--warn-bg)}.stat.warn span,.stat.warn b{color:var(--warn)}
.stat.bad{background:var(--bad-bg)}.stat.bad span,.stat.bad b{color:var(--bad)}
.formula{font-family:var(--m);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.chambers{font-size:13px;color:var(--ink2)}
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thumbs.eight{grid-template-columns:repeat(4,minmax(0,1fr))}
.thumbs figure{margin:0;position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--night)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs figcaption{position:absolute;left:6px;top:6px;font-size:12px;font-weight:600;color:#fff;background:rgba(12,18,32,.84);padding:3px 8px;border-radius:8px}
.thumbs.eight figcaption{font-size:10px;padding:2px 6px}
.thumbs .missing{display:flex;align-items:center;justify-content:center;color:var(--nmuted);font-size:12px}
.small-actions{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;font-size:13px;padding-top:2px}
.small-actions button{border:0;background:transparent;color:var(--trypan);font-weight:600;padding:8px 2px;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(92vw,460px);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--bad)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* lab module */
.home-main{display:flex;flex-direction:column;gap:16px;padding:6px 16px 28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px}
.sec-h h2{margin:0;font-size:13px;font-weight:600;color:var(--ink2)}
.sec-h a,.sec-h button{font-size:13px;font-weight:600;color:var(--trypan);background:none;border:0;text-decoration:none;padding:6px 0}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;min-height:96px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);text-align:left}
.action.primary{background:var(--trypan);border-color:var(--trypan);color:#fff}
.action b{font-size:15px}.action span{font-size:12px;color:var(--muted)}.action.primary span{color:#DCE4FA}
.due{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.due.soon{background:var(--warn-bg);border-color:#F2D7A8}.due.late{background:var(--bad-bg);border-color:#F3C4B6}
.due .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.due .tx b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.due .tx span{font-size:12px;color:var(--muted)}
.due.soon .tx span{color:var(--warn)}.due.late .tx span{color:var(--bad)}
.due button{min-height:40px;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;padding:0 12px;white-space:nowrap}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;border-top:1px solid #EDF0F5;background:transparent;text-align:left;width:100%;color:var(--ink)}
.item:first-child{border-top:0}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.item .tx b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:12px;color:var(--muted)}
.pnum{font-family:var(--m);font-size:13px;font-weight:600;color:var(--trypan);background:var(--trypan-tint);padding:4px 8px;border-radius:8px;white-space:nowrap}
.side{font-size:12px;color:var(--muted);white-space:nowrap}
.mini{min-height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-size:12px;font-weight:600;padding:0 10px;color:var(--ink2)}
.mini.danger{color:var(--bad)}
.form{display:flex;flex-direction:column;gap:14px;padding:4px 16px 24px}
.field select,.field textarea{font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);width:100%;min-width:0;color:var(--ink)}
.field textarea{min-height:72px;resize:vertical}
.field select:focus,.field textarea:focus{border-color:var(--trypan);outline:none;box-shadow:0 0 0 3px var(--trypan-tint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:#E8ECF3;padding:4px;border-radius:12px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(16,24,43,.12)}
.sqgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sqgrid .field input{font-family:var(--m);font-size:20px;text-align:center}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box.tight{gap:8px}
.vrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.9fr);gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--ground)}
.vrow .field label{font-size:12px}
.vrow .field input,.vrow .field select{font-size:15px;padding:9px 10px}
.vrow .wide{grid-column:1/-1}
.vrow .foot-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.calc{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.calc .eb{font-size:12px;font-weight:600;color:#A9B2C6;letter-spacing:.04em}
.calc table{width:100%;border-collapse:collapse;font-size:13px}
.calc th{font-size:11px;font-weight:500;color:#A9B2C6;text-align:right;padding:2px 0}
.calc th:first-child,.calc td:first-child{text-align:left}
.calc td{padding:4px 0;text-align:right;font-family:var(--m);font-variant-numeric:tabular-nums}
.calc td:first-child{font-family:var(--f)}
.calc .note{font-size:12px;color:#A9B2C6}
.calc .warn{color:#FFC27A}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px}
.chip b{font-weight:600}.chip span{color:var(--muted)}
.chip button{border:0;background:none;color:var(--muted);font-size:14px;padding:0 0 0 2px;min-height:auto}
.dot12{width:12px;height:12px;border-radius:50%;flex:none}
.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:center;gap:8px}
.grp-h input{flex:1;min-width:0;font:inherit;font-size:15px;font-weight:600;border:0;border-bottom:1.5px dashed var(--line2);padding:4px 2px;background:transparent}
.grp-row{display:grid;grid-template-columns:minmax(0,1fr) 86px 34px;gap:6px;align-items:center}
.grp-row select,.grp-row input{font:inherit;font-size:14px;padding:8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;width:100%}
.grp-row .u{font-size:12px;color:var(--muted)}
.grp-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grp-meta label{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.grp-meta input{font:inherit;font-size:14px;padding:8px;border:1.5px solid var(--line);border-radius:10px;min-width:0;width:100%}
.platemap{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.plate{display:grid;gap:3px;background:var(--ground);padding:6px;border-radius:8px}
.form input,.form select,.form textarea,.form button,.box input,.box button{scroll-margin-bottom:110px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.ev .thumbs{grid-column:2;margin-top:6px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block;background:#E8ECF3}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:transparent;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);min-height:32px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
</style>
</head>
<body>
<div class="app">

<!-- ================= 1 · START ================= -->
<section class="screen" id="sHome" aria-labelledby="hHome">
  <header class="top" style="padding-left:20px;padding-right:20px;justify-content:space-between;flex-wrap:wrap;row-gap:8px">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#2E4FB3"/><path d="M8 8h14v14H8z M15 8v14 M8 15h14" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
      <div style="display:flex;flex-direction:column"><span id="hHome" style="font-size:17px;font-weight:700">Cell Lab</span><span style="font-size:12px;color:var(--muted)" id="homeDate"></span></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
      <div class="lang" role="group" aria-label="Language / ภาษา"><button type="button" data-lang="th" aria-pressed="true">TH</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
      <span class="pill off" id="macPill" role="status"><span class="dot"></span><span id="macText"></span></span>
    </div>
  </header>
  <div class="home-main">
    <div class="me-row" id="meRow"><span class="me-l" data-i18n="meLabel"></span><div class="seg me-seg" id="meSeg" role="group"></div><span class="me-hint" id="meHint" data-i18n="pickMe"></span></div>
    <div class="notice warn" id="syncNote" hidden style="margin:0"><span id="syncText"></span><button type="button" id="syncBtn" data-i18n="syncNow"></button></div>
    <section id="dueSec" hidden style="display:flex;flex-direction:column;gap:8px" aria-labelledby="hDue">
      <div class="sec-h"><h2 id="hDue" data-i18n="dueTitle"></h2></div>
      <div id="dueList" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>
    <div class="actions">
      <button type="button" class="action primary" id="goCamera"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span style="display:flex;flex-direction:column"><b data-i18n="actCamera"></b><span data-i18n="actCameraSub"></span></span></button>
      <button type="button" class="action" id="goManual"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E4FB3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 12h18M12 3v18"/></svg><span style="display:flex;flex-direction:column"><b data-i18n="actManual"></b><span data-i18n="actManualSub"></span></span></button>
      <button type="button" class="action" id="goPassage"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E4FB3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h11l-3-3M20 17H9l3 3"/></svg><span style="display:flex;flex-direction:column"><b>Passage</b><span data-i18n="actPassageSub"></span></span></button>
      <button type="button" class="action" id="goTreat"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E4FB3" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M14 3l7 7M15.5 4.5L6 14a3 3 0 0 0 4 4l9.5-9.5M8 12l4 4"/></svg><span style="display:flex;flex-direction:column"><b>Treat</b><span data-i18n="actTreatSub"></span></span></button>
      <button type="button" class="action" id="goProtein"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7A3E9D" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3h8M9 3v14a3 3 0 0 0 6 0V3M9 11h6"/></svg><span style="display:flex;flex-direction:column"><b data-i18n="actProtein"></b><span data-i18n="actProteinSub"></span></span></button>
      <button type="button" class="action" id="goNote"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F7A6E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h5"/></svg><span style="display:flex;flex-direction:column"><b data-i18n="actNote"></b><span data-i18n="actNoteSub"></span></span></button>
      <button type="button" class="action wide" id="goGuide"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0F7A6E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 5h11M9 12h11M9 19h11"/><path d="M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/></svg><span style="display:flex;flex-direction:column"><b data-i18n="actGuide"></b><span data-i18n="actGuideSub"></span></span></button>
    </div>
    <section style="display:flex;flex-direction:column;gap:8px" aria-labelledby="hCult">
      <div class="sec-h"><h2 id="hCult" data-i18n="incTitle"></h2><span style="display:flex;gap:12px"><button type="button" id="goGrowth" data-i18n="grSettings"></button><button type="button" id="goAddCulture" data-i18n="addCulture"></button></span></div>
      <div class="list" id="cultList"></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px" aria-labelledby="hRecentLab">
      <div class="sec-h"><h2 id="hRecentLab" data-i18n="recentLog"></h2><button type="button" id="goLog" data-i18n="allLog"></button></div>
      <div class="list" id="homeLog"></div>
    </section>
  </div>
</section>

<section class="screen" id="sStart" aria-labelledby="hStart" hidden>
  <header class="top">
    <button type="button" class="icon-btn" id="startBack" data-i18n-aria="backHome"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title-col"><b data-i18n="actCamera"></b><span>Neubauer improved · CellNet</span></div>
  </header>
  <div class="start-main">
    <h1 id="hStart" data-i18n="startTitle"></h1>
    <div class="notice info" id="resumeBox" hidden style="margin:0"><span id="resumeText"></span><button type="button" id="resumeBtn" data-i18n="resume"></button></div>
    <div class="field">
      <label for="runName" data-i18n="sampleName"></label>
      <input id="runName" type="text" maxlength="120" autocomplete="off" data-i18n-ph="sampleNamePh">
      <span class="hint" data-i18n="sampleNameHint"></span>
    </div>
    <div>
      <div class="legend" id="layoutLegend" style="margin-bottom:8px" data-i18n="squaresCounted"></div>
      <div class="row2" role="group" aria-labelledby="layoutLegend">
        <button type="button" class="choice" data-layout="4" aria-pressed="true">
          <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="4" fill="#fff" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="3" width="9" height="9" fill="currentColor"/><rect x="22" y="3" width="9" height="9" fill="currentColor"/><rect x="3" y="22" width="9" height="9" fill="currentColor"/><rect x="22" y="22" width="9" height="9" fill="currentColor"/></svg>
          <span><b data-i18n="four"></b><span>1 chamber</span></span>
        </button>
        <button type="button" class="choice" data-layout="8" aria-pressed="false">
          <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="15" height="32" rx="3" fill="#fff" stroke="currentColor" stroke-width="1.3"/><rect x="18" y="1" width="15" height="32" rx="3" fill="#fff" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="3" width="4" height="4" fill="currentColor"/><rect x="10" y="3" width="4" height="4" fill="currentColor"/><rect x="3" y="27" width="4" height="4" fill="currentColor"/><rect x="10" y="27" width="4" height="4" fill="currentColor"/><rect x="20" y="3" width="4" height="4" fill="currentColor"/><rect x="27" y="3" width="4" height="4" fill="currentColor"/><rect x="20" y="27" width="4" height="4" fill="currentColor"/><rect x="27" y="27" width="4" height="4" fill="currentColor"/></svg>
          <span><b data-i18n="eight"></b><span>2 chambers</span></span>
        </button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label for="df">Dilution factor</label><input id="df" class="mono" type="text" inputmode="decimal" value="2"><span class="hint" data-i18n="dfHint"></span></div>
      <div class="field"><label for="cellSize" data-i18n="cellSizePx"></label><input id="cellSize" class="mono" type="text" inputmode="numeric" value="11"><span class="hint" data-i18n="cellSizeHint"></span></div>
    </div>
    <button type="button" class="btn primary" id="startBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span data-i18n="startCounting"></span>
    </button>
    <section style="display:flex;flex-direction:column;gap:8px;margin-top:4px" aria-labelledby="hRecent">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <h2 id="hRecent" style="margin:0;font-size:13px;font-weight:600;color:var(--ink2)" data-i18n="recentRounds"></h2>
        <span style="display:flex;gap:14px;font-size:13px;font-weight:500"><a href="reports/runs.csv" style="text-decoration:none" data-i18n="allCsv"></a><a href="old" style="text-decoration:none;color:var(--muted)" data-i18n="oldPage"></a></span>
      </div>
      <div class="recent" id="recent"><p class="empty-note" data-i18n="loading"></p></div>
    </section>
  </div>
</section>

<!-- ================= 2 · COUNT ================= -->
<section class="screen" id="sCount" hidden data-i18n-aria="countScreen">
  <header class="top">
    <button type="button" class="icon-btn" id="countBack" data-i18n-aria="backToStart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title-col"><b id="cName"></b><span id="cMeta"></span></div>
    <span class="pill blue mono" id="cProg"></span>
  </header>
  <nav class="slotnav" id="slotNav" data-i18n-aria="squares"></nav>
  <section class="stage" id="stage" data-i18n-aria="stageLabel">
    <canvas id="countCv" width="800" height="800" aria-hidden="true"></canvas>
    <div class="shoot" id="shootBox">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <b id="shootTitle" style="font-size:18px"></b>
      <p data-i18n="shootHint"></p>
      <label class="btn primary" for="camIn" data-i18n="takePhoto"></label>
      <label class="btn ghost" for="pickIn" data-i18n="fromAlbum"></label>
    </div>
    <div class="badge" id="cBadge" hidden><b id="cCount">0</b><span data-i18n="cells"></span></div>
    <span class="meta" id="cTime" hidden></span>
    <div class="busy" id="cBusy" hidden><div class="spin"></div><span id="cBusyText"></span></div>
  </section>
  <input id="camIn" class="visually-hidden" type="file" accept="image/*" capture="environment">
  <input id="pickIn" class="visually-hidden" type="file" accept="image/*">
  <div class="legend-row" id="cLegend" hidden>
    <span><span class="ring-ai"></span><span data-i18n="legendAi"></span></span><span><span class="ring-man"></span><span data-i18n="legendManual"></span></span><span><span class="dash"></span><span data-i18n="legendFrame"></span></span>
  </div>
  <div class="notice warn" id="roiNote" hidden><span data-i18n="noFrame"></span><button type="button" id="roiFix" data-i18n="setFrame"></button></div>
  <div class="notice info" id="roiReuse" hidden><span data-i18n="frameReused"></span><button type="button" id="roiCheck" data-i18n="checkFrame"></button></div>
  <footer class="foot">
    <div class="row2">
      <button type="button" class="btn" id="toReview" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span data-i18n="review"></span></button>
      <label class="btn" for="camIn" id="reshoot" aria-disabled="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span data-i18n="retake"></span></label>
    </div>
    <button type="button" class="btn primary split" id="saveSlot" disabled><span id="saveMain"></span><span class="sub" id="saveNext"></span></button>
  </footer>
</section>

<!-- ================= 3 · REVIEW ================= -->
<section class="screen dark" id="sReview" hidden data-i18n-aria="review">
  <header class="rv-head">
    <button type="button" class="icon-btn ring" id="undoBtn" data-i18n-aria="undo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <div class="mid"><b id="rTitle"></b><span id="rTally"></span></div>
    <button type="button" class="done-btn" id="rDone" data-i18n="done"></button>
  </header>
  <div class="rv-stage" id="rvStage">
    <canvas id="rvCv" data-i18n-aria="rvCanvas"></canvas>
    <span class="zlabel mono" id="zLabel">1×</span>
    <span class="zlabel" id="rBusy" hidden style="left:auto;right:64px;top:12px" data-i18n="recounting"></span>
    <div class="zoom"><button type="button" id="zIn" data-i18n-aria="zoomIn">+</button><button type="button" id="zOut" data-i18n-aria="zoomOut">−</button></div>
    <span class="hint-chip" id="rHint"></span>
  </div>
  <div class="rv-panel">
    <div class="tools" role="group" data-i18n-aria="tools">
      <button type="button" data-tool="pan" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span data-i18n="toolPan"></span></button>
      <button type="button" data-tool="add" aria-pressed="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg><span data-i18n="toolAdd"></span></button>
      <button type="button" data-tool="erase" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg><span data-i18n="toolErase"></span></button>
      <button type="button" data-tool="frame" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/></svg><span data-i18n="toolFrame"></span></button>
    </div>
    <div class="slider">
      <div class="lab"><label for="thr" data-i18n="strictness"></label><span class="mono" id="thrOut">0.85</span></div>
      <input id="thr" type="range" min="40" max="97" value="85">
      <div class="ends"><span data-i18n="strictLow"></span><span data-i18n="strictHigh"></span></div>
    </div>
    <div class="slider">
      <div class="lab"><label for="diam" data-i18n="cellSize"></label><span class="mono" id="diamOut">11 px</span></div>
      <input id="diam" type="range" min="4" max="60" value="11">
      <div class="ends"><span data-i18n="sizeHint"></span><button type="button" class="recount" id="recount" hidden data-i18n="recountSize"></button></div>
    </div>
  </div>
</section>

<!-- ================= 4 · SUMMARY ================= -->
<section class="screen" id="sSummary" hidden aria-labelledby="sName">
  <header class="top">
    <button type="button" class="icon-btn" id="sumBack" data-i18n-aria="backToSquares"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span style="font-size:15px;font-weight:600" data-i18n="summary"></span>
    <span class="pill ok" id="sDone" style="margin-left:auto"></span>
  </header>
  <div class="sum-main">
    <div class="sum-title"><h1 id="sName"></h1><span id="sWhen"></span></div>
    <section class="card" data-i18n-aria="results">
      <div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">CELLS / mL</span><span class="big" id="sPerMl">–</span></div>
      <div class="stats">
        <div class="stat"><span data-i18n="meanPerSquare"></span><b id="sMean">–</b></div>
        <div class="stat"><span>SD</span><b id="sSd">–</b></div>
        <div class="stat" id="sCvBox"><span id="sCvLab">CV</span><b id="sCv">–</b></div>
      </div>
      <span class="chambers" id="sCh" hidden></span>
      <span class="formula" id="sFormula"></span>
    </section>
    <section class="thumbs" id="sThumbs" data-i18n-aria="squareImages"></section>
    <button type="button" class="btn" id="sumPassage" data-i18n="useForPassage"></button>
    <div class="small-actions"><button type="button" id="sendTrain" data-i18n="sendTraining"></button></div>
  </div>
  <footer class="foot">
    <button type="button" class="btn primary" id="reportBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span id="reportLab"></span></button>
    <div class="row2"><a class="btn" href="reports/runs.csv" data-i18n="exportCsv"></a><button type="button" class="btn" id="nextRun" data-i18n="nextRound"></button></div>
  </footer>
</section>

<!-- ================= MANUAL COUNT ================= -->
<section class="screen" id="sManual" hidden aria-labelledby="hManual">
  <header class="top"><button type="button" class="icon-btn" data-back="sHome" data-i18n-aria="backHome"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title-col"><b id="hManual" data-i18n="actManual"></b><span data-i18n="manualSub"></span></div></header>
  <div class="form">
    <div class="field"><label for="mWhen" data-i18n="whenDone"></label><input id="mWhen" type="datetime-local"></div>
    <div class="field"><label for="mName" data-i18n="sampleName"></label><input id="mName" type="text" maxlength="120" autocomplete="off" data-i18n-ph="sampleNamePh"></div>
    <div class="field"><label for="mCulture" data-i18n="fromCulture"></label><select id="mCulture"></select></div>
    <div><div class="legend" style="margin-bottom:8px" data-i18n="squaresCounted"></div>
      <div class="seg" role="group" data-i18n-aria="squaresCounted"><button type="button" data-mlayout="4" aria-pressed="true" data-i18n="four"></button><button type="button" data-mlayout="8" aria-pressed="false" data-i18n="eight"></button></div></div>
    <div class="sqgrid" id="mSquares"></div>
    <div class="field"><label for="mDf">Dilution factor</label><input id="mDf" class="mono" type="text" inputmode="decimal" value="2"></div>
    <section class="card" data-i18n-aria="results">
      <div style="display:flex;flex-direction:column;gap:2px"><span class="eyebrow">CELLS / mL</span><span class="big" id="mPerMl">–</span></div>
      <div class="res"><div class="stat"><span data-i18n="meanPerSquare"></span><b id="mMean">–</b></div><div class="stat"><span>SD</span><b id="mSd">–</b></div><div class="stat" id="mCvBox"><span id="mCvLab">CV</span><b id="mCv">–</b></div></div>
      <span class="formula" id="mFormula"></span>
    </section>
  </div>
  <footer class="foot"><button type="button" class="btn primary" id="mSave" data-i18n="saveCount"></button>
    <button type="button" class="btn" id="mSavePassage" data-i18n="saveThenPassage"></button></footer>
</section>

<!-- ================= PASSAGE ================= -->
<section class="screen" id="sPassage" hidden aria-labelledby="hPassage">
  <header class="top"><button type="button" class="icon-btn" data-back="sHome" data-i18n-aria="backHome"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title-col"><b id="hPassage">Sub passage</b><span data-i18n="passageSub"></span></div><span class="pill blue mono" id="pPill"></span></header>
  <div class="form">
    <div class="field"><label for="pSource" data-i18n="sourceCulture"></label><select id="pSource"></select></div>
    <div class="row2"><div class="field"><label for="pLine" data-i18n="cellLine"></label><input id="pLine" type="text" maxlength="60" value="Hep-55.1C"></div>
      <div class="field"><label for="pTo" data-i18n="newPassage"></label><input id="pTo" class="mono" type="text" inputmode="numeric" placeholder="14"></div></div>
    <div class="field"><label for="pCount" data-i18n="useCount"></label><select id="pCount"></select></div>

$('countBack').onclick=()=>{saveRound();R&&($('resumeBox').hidden=true);const keep=R;R=null;checkResume();R=keep;show('sStart');};

function loadFile(f){
  if(!f) return;
  const url=URL.createObjectURL(f), im=new Image();
  im.onload=()=>{
    const MAX=2000,k=Math.min(1,MAX/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d',{willReadFrequently:true}).drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    autoLevels(c);
    shot={img:c,roi:null,roiReused:false,pts:null,added:[],removed:new Set(),undo:[]};
    if(lastRoiFrac){const fr=lastRoiFrac;shot.roi={x:fr.x*c.width,y:fr.y*c.height,w:fr.w*c.width,h:fr.h*c.height};shot.roiReused=true;}
    paintCount(); countShot();
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast(t('badImage'),true);};
  im.src=url;
}
function autoLevels(c){
  const g=c.getContext('2d',{willReadFrequently:true}),id=g.getImageData(0,0,c.width,c.height),d=id.data,h=new Uint32Array(256);
  for(let j=0;j<d.length;j+=16)h[(d[j]*.299+d[j+1]*.587+d[j+2]*.114)|0]++;
  const tot=h.reduce((a,b)=>a+b,0);let acc=0,lo=0,hi=255;
  for(let i=0;i<256;i++){acc+=h[i];if(acc<tot*.01)lo=i;if(acc<tot*.995)hi=i;}
  if(hi-lo<20)return;const s=255/(hi-lo);
  for(let j=0;j<d.length;j+=4)for(let k=0;k<3;k++){const v=(d[j+k]-lo)*s;d[j+k]=v<0?0:v>255?255:v;}
  g.putImageData(id,0,0);
}
$('camIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadFile(f);};
$('pickIn').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)loadFile(f);};

function frameOf(s){return s.roi||{x:0,y:0,w:s.img.width,h:s.img.height};}
async function countShot(){
  if(!shot) return;
  if(!INFO) await ping();
  if(!INFO){toast(t('noServer',host()),true);return;}
  const s=shot,d=diam(),r=frameOf(s),mg=d*2;
  const x0=Math.max(0,Math.floor(r.x-mg)),y0=Math.max(0,Math.floor(r.y-mg)),x1=Math.min(s.img.width,Math.ceil(r.x+r.w+mg)),y1=Math.min(s.img.height,Math.ceil(r.y+r.h+mg));
  const k=Math.min(1,INFO.target/d);
  const c=document.createElement('canvas');c.width=Math.max(8,Math.round((x1-x0)*k));c.height=Math.max(8,Math.round((y1-y0)*k));
  const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(s.img,x0,y0,x1-x0,y1-y0,0,0,c.width,c.height);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',.93));
  s.ctl?.abort(); const ctl=s.ctl=new AbortController(); const seq=s.seq=(s.seq||0)+1;
  $('cBusy').hidden=false;$('rBusy').hidden=false;$('cBusyText').textContent=t('counting',host());
  const t0=performance.now();
  try{
    const res=await api(`api/count?diam=${(d*k).toFixed(2)}`,{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob,signal:ctl.signal});
    if(!res.ok){const m=await res.text().catch(()=>'');throw new Error(res.status+(m?' '+m.slice(0,80):''));}
    const j=await res.json(); if(shot!==s||seq!==s.seq) return;
    s.pts=j.points.map(([x,y,p],i)=>({x:x0+(x+.5)/k-.5,y:y0+(y+.5)/k-.5,p,i}));
    s.secs=j.secs; s.diamUsed=d; s.removed=new Set();
  }catch(e){
    if(e.name==='AbortError') return;
    toast(t('countFail',e.message||e),true);
  }finally{if(seq===s.seq){$('cBusy').hidden=true;$('rBusy').hidden=true;}}
  paintCount(); if(!$('sReview').hidden) drawReview(); updateRecount();
}
function inFrame(p,roi,d){if(!roi)return true;const rad=d/2;return p.x>=roi.x-rad&&p.y>=roi.y-rad&&p.x<roi.x+roi.w-rad&&p.y<roi.y+roi.h-rad;}
function aiCells(){
  if(!shot||!shot.pts) return [];
  const d=diam(),sep=d*.55,out=[];
  for(const p of shot.pts.filter(p=>p.p>thrV).sort((a,b)=>b.p-a.p)) if(!out.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<sep)) out.push(p);
  return out.filter(p=>inFrame(p,shot.roi,d));
}
function cellsNow(){
  if(!shot) return [];
  return aiCells().filter(p=>!shot.removed.has(p.i)).map(p=>({x:p.x,y:p.y,src:'ai',i:p.i})).concat(shot.added.map((p,j)=>({x:p.x,y:p.y,src:'man',j})));
}
function tally(){const ai=aiCells();return {ai:ai.length,added:shot.added.length,removed:ai.filter(p=>shot.removed.has(p.i)).length};}

function drawCells(g,list,map,rad,lw){
  for(const c of list){const [X,Y]=map(c.x,c.y);
    g.lineWidth=lw+1.6;g.strokeStyle='rgba(0,0,0,.6)';g.beginPath();g.arc(X,Y,rad,0,7);g.stroke();
    g.lineWidth=lw;g.strokeStyle=c.src==='man'?'#FF9F1C':'#29E0A8';g.beginPath();g.arc(X,Y,rad,0,7);g.stroke();}
}
function drawRoi(g,roi,map,lw){if(!roi)return;const [a,b]=map(roi.x,roi.y),[c,d]=map(roi.x+roi.w,roi.y+roi.h);
  g.save();g.setLineDash([lw*4,lw*3]);g.lineWidth=lw;g.strokeStyle='#FFD166';g.strokeRect(a,b,c-a,d-b);g.restore();}

  return {recs,done,n,total:slots().length,sum:v.reduce((a,b)=>a+b,0),mean,sd,cv:sd/mean*100,df:R.df,vol:R.vol,perMl:mean*R.df/R.vol,chambers};

const LAB={server:store.get('cc.labcache',[]),outbox:store.get('cc.outbox',[]),online:null};

  const del=new Set([...m.values()].filter(e=>e.type==='delete').map(e=>e.target));

    catch(e){LAB.online=false;break;}}

}

function cultures(){
  const c=new Map();
  for(const e of allEvents()){
    if(e.type==='culture'&&e.culture) c.set(e.culture.cid,{...e.culture,created:e.at,status:'active',src:e.id,owner:e.culture.owner||e.owner||''});
    if(e.type==='passage'){ for(const s of [e.source_cid,...(e.source_cids||[])]) if(s&&c.has(s)) c.get(s).status='passaged';
      (e.outputs||[]).forEach(o=>c.set(o.cid,{cid:o.cid,line:e.line,passage:e.to_passage,vessel:o.vessel,qty:o.qty,purpose:o.purpose,cells:o.cells_per_unit,created:e.at,status:'active',src:e.id,owner:o.owner||e.owner||''}));}
    if(e.type==='treat') (e.cids||[]).forEach(id=>{if(c.has(id)){c.get(id).status='treating';c.get(id).treat=e.id;}});
    if(e.type==='harvest'){for(const x of c.values()) if(x.treat===e.treat_id) x.status='harvested';}
    if(e.type==='discard'&&c.has(e.cid)) c.get(e.cid).status='discarded';
  }
  return [...c.values()];
}

function treatCalc(){
  const lib=Object.fromEntries(compoundsLib().map(c=>[c.name,c])),vol=num($('tVol').value),extra=(num($('tExtra').value)||0)/100;
  const rows=tGroups.map(g=>{const med=(num(g.wells)||0)*vol*(1+extra);let solv={};
    const stocks=g.cmps.filter(c=>c.name).map(c=>{const s=lib[c.name];const ul=num(c.uM)*med*1000/stockUM(s);if(s&&isFinite(ul))solv[s.solvent]=(solv[s.solvent]||0)+ul;return {name:c.name,uM:num(c.uM),ul,solvent:s?.solvent,missing:!s||!(stockUM(s)>0)};});
    return {g,med,stocks,solv};});
  // match organic solvents (DMSO/EtOH) across groups to the highest fraction
  const solvents=new Set(rows.flatMap(r=>Object.keys(r.solv)).filter(s=>s==='DMSO'||s==='EtOH'));const target={};
  for(const s of solvents)target[s]=Math.max(...rows.map(r=>r.med>0?(r.solv[s]||0)/(r.med*1000):0));

function describe(e){
  const L=(...xs)=>xs.flat().filter(x=>x!=null&&x!=='').join('\n'),cv=isFinite(e.cv)?`CV ${(+e.cv).toFixed(1)}%`:'';
  const wellsOf=g=>(g.wells_pos||[]).join(',')||`${g.wells} ${t('unitWell')}`;
  switch(e.type){
    case 'count':return {title:`${t('evCount')} · ${sci(e.cells_per_ml)} cells/mL`,sub:L(e.title,[e.method==='manual'?t('manual'):t('camera'),`${e.n}/${e.layout}`,cv].filter(Boolean).join(' · '))};
    case 'passage':return {title:`${t('evPassage')} ${e.line} ${t('passageArrow',e.from_passage,e.to_passage)}`,
      sub:L((e.outputs||[]).map(o=>`${vName(o.vessel)} × ${o.qty}`+(o.cells_per_unit?` · ${sciShort(o.cells_per_unit)}/${vUnit(o.vessel)}`:'')))};
    case 'treat':return {title:`${t('evTreat')} · ${e.title}`,sub:L([e.line?`${e.line} P${e.passage}`:'',`${vName(e.vessel)} × ${e.plates||1}`].filter(Boolean).join(' · '),
      (e.groups||[]).map(g=>`${wellsOf(g)} — ${g.name}`),e.duration_h?`${t('duration')} ${e.duration_h} h`:'')};
    case 'harvest':return {title:`${t('evHarvest')} · ${e.title||''}`,sub:''};
    case 'culture':return {title:`${t('evCulture')} · ${e.culture.line} P${e.culture.passage}`,sub:L(`${vName(e.culture.vessel)} × ${e.culture.qty}`,e.culture.notes)};
    case 'discard':return {title:t('evDiscard'),sub:e.title||''};
    case 'compound':return {title:`${t('evCompound')} · ${e.compound?.name}`,sub:`${e.compound?.stock} ${e.compound?.unit==='uM'?'µM':'mM'} · ${e.compound?.solvent}`};
    case 'protein':{const cc=proteinConc(e.id),tb=e.tubes||[];
      return {title:`${t('evProtein')} · ${e.title}`,sub:L([t('tubesN',tb.length),[e.storage,e.box].filter(Boolean).join(' ')].filter(Boolean).join(' · '),
        [e.buffer,e.vol_per_well?`${e.vol_per_well} µL/${t('unitWell')}`:''].filter(Boolean).join(' · '),
        tb.map(x=>`${x.wells?x.wells+' — ':''}${x.label}${cc[x.label]!=null?` · ${cc[x.label]} mg/mL`:''}`))};}
    case 'checklist':return {title:`${t('ckTitle')} · ${t({count:'evCount',passage:'evPassage',treat:'evTreat',protein:'evProtein'}[e.kind]||'evNote')}`,sub:String(e.text||'').split('\n').filter(l=>l.trim()&&!l.startsWith('#')).length+' ✓'};

}

/* ---------- photos: kept on the phone (IndexedDB) until uploaded ---------- */
const PDB={mem:new Map(),db:null,
  open(){if(!this.db)this.db=new Promise((res,rej)=>{try{const r=indexedDB.open('cclab',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return this.db;},
  async run(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('photos',mode),st=tx.objectStore('photos');const r=fn(st);tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);});},
  async put(id,b){this.mem.set(id,b);try{await this.run('readwrite',s=>s.put(b,id));}catch(e){}},
  async get(id){if(this.mem.has(id))return this.mem.get(id);try{return await this.run('readonly',s=>s.get(id));}catch(e){return null;}},
  async del(id){this.mem.delete(id);try{await this.run('readwrite',s=>s.delete(id));}catch(e){}}};
function shrinkPhoto(file,max=2000){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(0),'image/jpeg',.86);};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(0);};im.src=u;});}
async function uploadPhotos(ids){for(const id of ids||[]){const b=await PDB.get(id);if(!b)continue;
  const r=await api('api/lab/photo?id='+id,{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b});if(!r.ok)throw 0;await PDB.del(id);}}
const photoUrl=id=>`lab/photos/${id}.jpg`;
function thumbs(ids){const box=document.createElement('div');box.className='thumbs';
  for(const id of ids){const a=document.createElement('a');a.href=photoUrl(id);a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',t('openPhoto'));

  nPhotos.forEach((p,i)=>{const d=document.createElement('div');d.className='thumb-edit';const im=new Image();im.src=p.url;im.alt='';
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label',t('removePhoto'));
    x.onclick=()=>{PDB.del(p.id);URL.revokeObjectURL(p.url);nPhotos.splice(i,1);paintNotePhotos();};d.append(im,x);box.append(d);});}
$('nFile').onchange=async()=>{const files=[...$('nFile').files];$('nFile').value='';
  for(const f of files){try{const b=await shrinkPhoto(f);const id=uid();await PDB.put(id,b);nPhotos.push({id,url:URL.createObjectURL(b)});}catch(e){toast(t('photoFail'),true);}}
  paintNotePhotos();};
$('nSave').onclick=()=>{const tx=$('nText').value.trim();if(!tx&&!nPhotos.length){toast(t('needNoteOrPhoto'),true);$('nText').focus();return;}
  const ab=$('nAbout').value;
  addEvent({at:readWhen('nWhen'),type:'note',title:tx?tx.slice(0,60):`${t('photoWord')} ×${nPhotos.length}`,text:tx,photos:nPhotos.map(p=>p.id),
    treat_id:ab.startsWith('t:')?ab.slice(2):null,cid:ab.startsWith('c:')?ab.slice(2):null});
  nPhotos.forEach(p=>URL.revokeObjectURL(p.url));nPhotos=[];$('nText').value='';paintNotePhotos();show('sHome');};

/* ---------- protein harvest ---------- */
let prTubes=[],prMode='group',prTouched=false;
const proteinTreats=()=>{const open=new Set(openTreats().map(e=>e.id));return allEvents().filter(e=>e.type==='treat'&&(open.has(e.id)||Date.now()-new Date(e.at)<45*864e5)).reverse();};
function openProtein(treatId){
  $('prWhen').value=nowLocal();
  const sel=$('prTreat');sel.innerHTML='';const o=document.createElement('option');o.value='';o.textContent=t('noneTreat');sel.append(o);
  for(const e of proteinTreats()){const x=document.createElement('option');x.value=e.id;x.textContent=`${e.title} · ${shortDate(new Date(e.at))}`;sel.append(x);}
  sel.value=treatId||openTreats().sort((a,b)=>new Date(a.at)-new Date(b.at))[0]?.id||'';
  prTouched=false;buildTubes();show('sProtein');}
const prTreatEv=()=>allEvents().find(e=>e.id===$('prTreat').value&&e.type==='treat');
function buildTubes(){const tr=prTreatEv(),vol=num($('prVol').value);
  $('prHarvWrap').hidden=!(tr&&openTreats().some(x=>x.id===tr.id));$('prHarv').checked=true;
  if(!tr){if(!prTubes.length||!prTouched)prTubes=[{label:'',wells:'',vol:isFinite(vol)?vol:''}];paintTubes();return;}
  prTubes=[];
  for(const g of tr.groups||[]){const n=num(g.wells)||0,pos=g.wells_pos||[];
    if(prMode==='group')prTubes.push({label:g.name,wells:pos.join(',')||String(n),vol:isFinite(vol)?vol*n:''});
    else for(let k=0;k<n;k++)prTubes.push({label:`${g.name} · ${pos[k]||k+1}`,wells:pos[k]||'',vol:isFinite(vol)?vol:''});}
  paintTubes();}
function paintTubes(){
  document.querySelectorAll('[data-prmode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.prmode===prMode));
  const box=$('prTubes');box.innerHTML='';
  prTubes.forEach((r,i)=>{const d=document.createElement('div');d.className='tube-card';
    d.innerHTML='<input type="text" maxlength="60" class="tl"><label class="tw"><span></span><input type="text" maxlength="40"></label><label class="tv"><span>µL</span><input type="text" class="mono" inputmode="decimal"></label><button type="button" class="mini danger">×</button>';
    d.querySelector('.tw span').textContent=t('wellsLbl');d.querySelector('.tl').placeholder=t('tubeLabel');
    const [l,w,v]=d.querySelectorAll('input');l.value=r.label;w.value=r.wells;v.value=r.vol;
    l.setAttribute('aria-label',`${t('tubeLabel')} ${i+1}`);w.setAttribute('aria-label',`${t('wellsLbl')} ${i+1}`);v.setAttribute('aria-label',`${t('volLbl')} ${i+1}`);
    l.oninput=()=>{r.label=l.value;prTouched=true;};w.oninput=()=>{r.wells=w.value;prTouched=true;};v.oninput=()=>{r.vol=v.value;prTouched=true;};
    const x=d.querySelector('button');x.setAttribute('aria-label',t('remove'));x.onclick=()=>{prTubes.splice(i,1);prTouched=true;paintTubes();};box.append(d);});}
$('prTreat').onchange=()=>{prTouched=false;buildTubes();};
$('prVol').oninput=()=>{if(!prTouched)buildTubes();};
document.querySelectorAll('[data-prmode]').forEach(b=>b.onclick=()=>{prMode=b.dataset.prmode;prTouched=false;buildTubes();});
$('prAddTube').onclick=()=>{prTubes.push({label:'',wells:'',vol:$('prVol').value});prTouched=true;paintTubes();};
$('prSave').onclick=()=>{
  const tubes=prTubes.filter(r=>String(r.label).trim()).map(r=>({label:String(r.label).trim(),wells:String(r.wells).trim(),vol_ul:num(r.vol)||null}));
  if(!tubes.length){toast(t('needTubes'),true);return;}
  const tr=prTreatEv(),at=readWhen('prWhen');
  addEvent({at,type:'protein',title:tr?tr.title:tubes[0].label,treat_id:tr?.id||null,cids:tr?.cids||[],line:tr?.line||null,passage:tr?.passage||null,
    buffer:$('prBuf').value.trim(),vol_per_well:num($('prVol').value)||null,mode:prMode,tubes,storage:$('prStore').value.trim(),box:$('prBox').value.trim(),notes:$('prNotes').value.trim()});
  if(tr&&!$('prHarvWrap').hidden&&$('prHarv').checked)addEvent({at,type:'harvest',treat_id:tr.id,title:tr.title,notes:t('evProtein')});
  $('prNotes').value='';$('prBox').value='';prTubes=[];show('sHome');};

function proteinConc(id){const c={};for(const e of allEvents())if(e.type==='bca'&&e.target===id)Object.assign(c,e.conc||{});return c;}
function openBca(e,art){if(art.querySelector('.bca-box'))return;const conc=proteinConc(e.id);
  const f=document.createElement('div');f.className='box bca-box';f.style.gridColumn='2';
  for(const tb of e.tubes||[]){const r=document.createElement('label');r.className='tube-row';r.style.gridTemplateColumns='minmax(0,1fr) 110px';
    r.innerHTML='<span style="font-size:13px"></span><input type="text" class="mono" inputmode="decimal" placeholder="mg/mL">';r.querySelector('span').textContent=tb.label;
    const i=r.querySelector('input');i.dataset.label=tb.label;i.value=conc[tb.label]??'';f.append(r);}
  const row=document.createElement('div');row.className='row2';row.innerHTML='<button type="button" class="btn"></button><button type="button" class="btn primary" style="min-height:48px;font-size:15px"></button>';
  const [c,s]=row.querySelectorAll('button');c.textContent=t('cancel');s.textContent=t('saveConc');c.onclick=()=>f.remove();
  s.onclick=()=>{const v={};f.querySelectorAll('input').forEach(i=>{const x=num(i.value);if(isFinite(x))v[i.dataset.label]=x;});
    if(Object.keys(v).length)addEvent({type:'bca',target:e.id,title:e.title,conc:v});f.remove();};
  f.append(row);art.append(f);f.querySelector('input')?.focus();}
$('goProtein').onclick=()=>openProtein();
$('goNote').onclick=()=>openNote();
$('logNote').onclick=()=>openNote();

const plateDims=per=>per===6?[2,3]:per===12?[3,4]:per===24?[4,6]:per===96?[8,12]:[1,1];
const posLabel=(per,plates,q)=>{const [rows]=plateDims(per),p=Math.floor(q/per),w=q%per;return (plates>1?`P${p+1}-`:'')+(Math.floor(w/rows)+1)+String.fromCharCode(65+w%rows);};
/* well position -> group index, from stored positions or filled column by column (1A,1B,2A,...) */
function treatWellMap(e){const per=VESSELS[e.vessel]?.wells||1,plates=num(e.plates)||1,m={};let q=0;
  (e.groups||[]).forEach((g,i)=>{const n=num(g.wells)||0,pos=g.wells_pos||[];for(let k=0;k<n;k++){m[pos[k]||posLabel(per,plates,q)]=i;q++;}});
  return {m,per,plates};}
const shortConc=g=>{const c=(g.compounds||[]).filter(x=>x.name);if(!c.length)return '0';return c.map(x=>fmtN(num(x.uM))).join('+');};
function plateGrid({m,per,plates},groups,big){
  const wrap=document.createElement('div');wrap.className='pm-wrap';const [rows,cols]=plateDims(per);
  for(let p=0;p<plates;p++){const pl=document.createElement('div');pl.className='pm'+(big?' big':'');pl.style.gridTemplateColumns=`20px repeat(${cols},minmax(0,1fr))`;
    if(plates>1){const h=document.createElement('div');h.className='pm-title';h.textContent=t('dPlateN',p+1);pl.append(h);}
    pl.append(document.createElement('span'));
    for(let c=1;c<=cols;c++){const s=document.createElement('span');s.className='pm-ax';s.textContent=c;pl.append(s);}
    for(let r=0;r<rows;r++){const s=document.createElement('span');s.className='pm-ax';s.textContent=String.fromCharCode(65+r);pl.append(s);
      for(let c=1;c<=cols;c++){const lab=(plates>1?`P${p+1}-`:'')+c+String.fromCharCode(65+r),gi=m[lab],w=document.createElement('span');
        w.className='pm-well'+(gi==null?' empty':'');w.title=lab+(gi!=null?` · ${groups[gi].name}`:'');
        if(gi!=null){const col=COLORS[gi%COLORS.length];w.style.background=col;w.style.color=DARK.has(col)?'#fff':'#10182B';if(per<=24)w.textContent=shortConc(groups[gi]);}
        pl.append(w);}}
    wrap.append(pl);}
  return wrap;}

let dBack='sLog',dId=null;
const dEl=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!=null)x.textContent=text;return x;};
function dSection(title){const s=dEl('section','d-sec');s.append(dEl('h2','d-h',title));return s;}
function dKV(rows){const d=dEl('dl','kv');for(const [k,v] of rows){if(v==null||v==='')continue;d.append(dEl('dt',null,k));const dd=dEl('dd');if(v instanceof Node)dd.append(v);else dd.textContent=v;d.append(dd);}return d;}
function dTable(head,rows){const tb=dEl('table','dtab');const tr=dEl('tr');head.forEach(h=>tr.append(dEl('th',null,h)));const th=dEl('thead');th.append(tr);tb.append(th);
  const body=dEl('tbody');for(const r of rows){const x=dEl('tr');r.forEach(c=>{const td=dEl('td');if(c instanceof Node)td.append(c);else td.textContent=c??'–';x.append(td);});body.append(x);}tb.append(body);
  const w=dEl('div','dtab-wrap');w.append(tb);return w;}
function dSteps(text){const ol=dEl('ol','steps');String(text).split(/\s*·\s*/).filter(Boolean).forEach(s=>ol.append(dEl('li',null,s)));return ol;}
function dLink(ev){const b=dEl('button','d-link');b.type='button';const ds=describe(ev);b.append(dEl('b',null,ds.title),dEl('span',null,shortDate(new Date(ev.at))));b.onclick=()=>openDetail(ev.id,true);return b;}
function dPhotos(ids){const g=dEl('div','d-photos');for(const id of ids){const a=dEl('a');a.href=photoUrl(id);a.target='_blank';a.rel='noopener';a.setAttribute('aria-label',t('openPhoto'));
  const im=new Image();im.loading='lazy';im.alt='';im.src=photoUrl(id);im.onerror=async()=>{im.onerror=null;const b=await PDB.get(id);if(b){const u=URL.createObjectURL(b);im.src=u;a.href=u;}};a.append(im);g.append(a);}return g;}
const swatch=i=>{const s=dEl('span','dot12');s.style.background=COLORS[i%COLORS.length];return s;};
const withDot=(i,text)=>{const s=dEl('span','with-dot');s.append(swatch(i),document.createTextNode(text));return s;};
const evById=id=>allEvents().find(e=>e.id===id);

function openDetail(id,keepBack){const e=evById(id);if(!e)return;if(!keepBack){const cur=SCREENS.find(s=>!$(s).hidden);dBack=cur==='sDetail'?dBack:(cur||'sLog');}
  dId=id;paintDetail();show('sDetail');window.scrollTo(0,0);}
$('dBackBtn').onclick=()=>{if(dBack==='sLog')openLog();else show(dBack);};
function paintDetail(){
  const e=evById(dId),body=$('dBody');body.innerHTML='';if(!e){show(dBack);return;}
  const ds=describe(e),d=new Date(e.at),[bg,fg,path]=ICON[e.type]||ICON.note;
  $('dTitle').textContent=ds.title;$('dSub').textContent=`${niceDate(d)}`;
  $('dIcon').style.background=bg;$('dIcon').innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${fg}" stroke-width="2" stroke-linecap="round" aria-hidden="true">${path}</svg>`;
  const all=allEvents();
  const meta=dSection(t('dWhen'));meta.querySelector('h2').remove();
  const rows=[];
  if(e.type==='treat'){
    const hv=all.find(x=>x.type==='harvest'&&x.treat_id===e.id),wm=treatWellMap(e);
    rows.push([t('dCells'),[e.line,e.passage!=null?'P'+e.passage:''].filter(Boolean).join(' · ')],[t('dVessel'),`${vName(e.vessel)} × ${e.plates||1}`+(e.well_ml?` · ${e.well_ml} mL/${t('unitWell')}`:'')],
      [t('dMedium'),e.medium||''],[t('dDuration'),e.duration_h?t('dHours',e.duration_h):''],[t('dHarvest'),hv?shortDate(new Date(hv.at)):e.harvest_at?t('due',shortDate(new Date(e.harvest_at))):t('dNotHarvested')]);
    body.append(dKV(rows));
    const pm=dSection(t('plateMap'));pm.append(plateGrid(wm,e.groups||[],true));
    const leg=dEl('div','legend');(e.groups||[]).forEach((g,i)=>leg.append(withDot(i,g.name)));pm.append(leg);body.append(pm);
    const gs=dSection(t('dGroups'));
    gs.append(dTable([t('dGroups'),t('dWells'),t('dConc'),'DMSO'],(e.groups||[]).map((g,i)=>[withDot(i,g.name),(g.wells_pos||[]).join(', ')||String(g.wells),
      (g.compounds||[]).filter(c=>c.name).map(c=>`${c.name} ${fmtN(num(c.uM))} µM`).join(' + ')||'0 µM',g.dmso_pct!=null?g.dmso_pct+'%':''])));
    const preps=(e.groups||[]).filter(g=>g.prep);
    if(preps.length){const ul=dEl('ul','preps');preps.forEach(g=>{const li=dEl('li');li.append(dEl('b',null,g.name),document.createTextNode('\n'+String(g.prep).split(/\s+·\s+/).join('\n')));ul.append(li);});gs.append(dEl('h3','d-h3',t('dPrep')),ul);}
    body.append(gs);
    if(e.protocol){const s=dSection(t('dProtocol'));s.append(dSteps(e.protocol));body.append(s);}
  } else if(e.type==='protein'){
    const tr=e.treat_id&&evById(e.treat_id),cc=proteinConc(e.id);
    rows.push([t('dFromExp'),tr?dLink(tr):''],[t('dCells'),[e.line,e.passage!=null?'P'+e.passage:''].filter(Boolean).join(' · ')],[t('dBuffer'),e.buffer||''],
      [t('dVol'),e.vol_per_well?`${e.vol_per_well} µL ${t('dPerWell')}`:''],[t('dStorage'),[e.storage,e.box].filter(Boolean).join(' · ')]);
    body.append(dKV(rows));
    if(tr){const pm=dSection(t('plateMap'));pm.append(plateGrid(treatWellMap(tr),tr.groups||[],true));const leg=dEl('div','legend');(tr.groups||[]).forEach((g,i)=>leg.append(withDot(i,g.name)));pm.append(leg);body.append(pm);}
    const ts=dSection(t('dTubes'));const hasC=Object.keys(cc).length;
    ts.append(dTable([t('tubeLabel'),t('dWells'),'µL'].concat(hasC?['mg/mL']:[]),(e.tubes||[]).map((x,i)=>[tr?withDot(i,x.label):x.label,x.wells||'',x.vol_ul??''].concat(hasC?[cc[x.label]??'']:[]))));body.append(ts);
    if(e.lysis_mix){const L=e.lysis_mix,s=dSection(t('dLysis'));
      s.append(dKV([['RIPA',L.RIPA_ul!=null?`${L.RIPA_ul} µL`:''],['Protease inhibitor 100×',L.protease_inhibitor_100x_ul!=null?`${L.protease_inhibitor_100x_ul} µL`:''],
        ['Phosphatase inhibitor',L.phosphatase_inhibitor_ul!=null?`${L.phosphatase_inhibitor_ul} µL`:''],['PUGNAc 1 mM',L.PUGNAc_1mM_ul!=null?`${L.PUGNAc_1mM_ul} µL`:''],[t('dCatalog'),L.catalog||'']]));body.append(s);}
    if(e.protocol){const s=dSection(t('dProtocol'));s.append(dSteps(e.protocol));body.append(s);}
  } else if(e.type==='passage'){
    const src=e.source_cid&&all.find(x=>x.type==='passage'&&(x.outputs||[]).some(o=>o.cid===e.source_cid));
    rows.push([t('dCells'),`${e.line} · P${e.from_passage} → P${e.to_passage}`],[t('cellsPerMl'),e.cells_per_ml?sci(e.cells_per_ml):''],[t('dSource'),src?dLink(src):'']);
    body.append(dKV(rows));
    const s=dSection(t('dOutputs'));
    s.append(dTable([t('vessel'),t('qty'),t('dPerUnit'),'medium',t('dSusp'),t('dPurpose')],(e.outputs||[]).map(o=>[vName(o.vessel),String(o.qty),o.cells_per_unit?`${sciShort(o.cells_per_unit)}/${vUnit(o.vessel)}`:'',
      o.medium_ml?`${o.medium_ml} mL`:'',o.susp_ul?fmtUl(o.susp_ul):'',t({keep:'purposeKeep',treat:'purposeTreat',other:'purposeOther'}[o.purpose]||'purposeOther')])));body.append(s);
  } else if(e.type==='count'){
    rows.push([t('dMethod'),e.method==='manual'?t('manual'):t('camera')],[t('cellsPerMl'),sci(e.cells_per_ml)],[t('dMean'),isFinite(e.mean)?`${(+e.mean).toFixed(1)} ± ${isFinite(e.sd)?(+e.sd).toFixed(1):'–'}`:''],
      ['CV',isFinite(e.cv)?(+e.cv).toFixed(1)+'%':''],[t('dDf'),e.df]);
    if(e.report){const s=dSection(t('reportImg'));const im=new Image();im.src=e.report;im.alt='';im.className='d-report';s.append(im);setTimeout(()=>body.append(s),0);}
    if(e.report){const a=dEl('a',null,t('viewReport'));a.href=e.report;a.target='_blank';a.rel='noopener';rows.push([t('dReport'),a]);}
    body.append(dKV(rows));
    if(e.squares){const s=dSection(t('dSquares'));s.append(dTable([t('dSquare'),t('dCount')],Object.entries(e.squares).map(([k,v])=>[slotLabel(k,e.layout||4),v==null?'–':String(v)])));body.append(s);}
  } else if(e.type==='note'){
    const tr=e.treat_id&&evById(e.treat_id),cu=e.cid&&cultures().find(x=>x.cid===e.cid);
    if(e.text){const p=dEl('p','d-text',e.text);body.append(p);}
    body.append(dKV([[t('dAbout'),tr?dLink(tr):cu?cultLabel(cu):'']]));
  } else if(e.type==='harvest'){const tr=evById(e.treat_id);body.append(dKV([[t('dFromExp'),tr?dLink(tr):'']]));}
  else if(e.type==='culture'){const c=e.culture||{};body.append(dKV([[t('dCells'),`${c.line} · P${c.passage}`],[t('vessel'),`${vName(c.vessel)} × ${c.qty}`]]));}
  else if(e.type==='compound'){const c=e.compound||{};body.append(dKV([[t('dStock'),`${c.stock} ${c.unit==='uM'?'µM':'mM'}`],[t('solvent'),c.solvent]]));}
  else if(e.type==='bca'){const p=evById(e.target);body.append(dKV([[t('dFor'),p?dLink(p):'']]));body.append(dTable([t('tubeLabel'),'mg/mL'],Object.entries(e.conc||{}).map(([k,v])=>[k,String(v)])));}
  if(e.notes){const s=dSection(t('dNotes'));const ul=dEl('ul','note-list');String(e.notes).split(/\s+·\s+/).filter(Boolean).forEach(x=>ul.append(dEl('li',null,x)));s.append(ul);body.append(s);}

    (e.type==='passage'&&x.type==='passage'&&(e.outputs||[]).some(o=>o.cid===x.source_cid))||(e.type==='treat'&&x.type==='note'&&x.treat_id===e.id)));
  if(rel.length){const s=dSection(t('dRelated'));const l=dEl('div','d-links');rel.forEach(x=>l.append(dLink(x)));s.append(l);body.append(s);}
  if(e.owner)body.insertBefore(dKV([[t('dOwner'),whoBadge(e.owner)]]),body.firstChild);
  const foot=dKV([[t('dBy'),e.by&&e.by!=='local'?e.by:''],[t('dEdited'),e.edited||'']]);foot.classList.add('kv-small');body.append(foot);

  if(e.type==='treat'){const b=dEl('button','btn',t('harvestProtein'));b.type='button';b.onclick=()=>openProtein(e.id);acts.append(b);}

  {const pb=dEl('button','btn',t('pdf'));pb.type='button';pb.onclick=()=>printDetail();acts.prepend(pb);}

/* ---------- incubator ---------- */
function paintIncubator(now){
  const cl=$('cultList');cl.innerHTML='';const list=activeCultures(),open=openTreats(),all=allEvents();
  if(!list.length){const p=document.createElement('p');p.className='empty-note';p.textContent=t('incEmpty');cl.append(p);return;}
  for(const c of list.slice(0,16)){
    const days=Math.floor((now-new Date(c.created))/864e5)+1,trs=open.filter(e=>(e.cids||[]).includes(c.cid));
    const card=document.createElement('div');card.className='inc-card';card.tabIndex=0;card.setAttribute('role','button');
    const top=document.createElement('div');top.className='inc-top';
    top.innerHTML='<span class="pnum"></span><span class="tx"><b></b><span></span></span><span class="side"></span>';
    top.querySelector('.pnum').textContent='P'+c.passage;
    top.querySelector('b').textContent=`${c.line} · ${vName(c.vessel)}${c.qty>1?' × '+c.qty:''}`;
    top.querySelector('.tx span').textContent=t('incSeeded',shortDate(new Date(c.created)))+(trs.length?` · ${t('incTreat')}`:'');
    top.querySelector('.side').textContent=t('dayN',days);if(c.owner)top.querySelector('.tx b').append(' ',whoBadge(c.owner));card.append(top);
    if(!trs.length&&c.purpose!=='treat')card.append(growthRow(c));
    trs.forEach((tr,i)=>{const b=document.createElement('div');b.className='inc-treat';
      const h=document.createElement('div');h.className='inc-th';
      h.append(Object.assign(document.createElement('b'),{textContent:tr.title}),
        Object.assign(document.createElement('span'),{textContent:[trs.length>1&&c.qty>1?t('incPlateOf',i+1,c.qty):'',t('incStarted',shortDate(new Date(tr.at))),
          tr.harvest_at?t('incHarvestDue',shortDate(new Date(tr.harvest_at))):t('incNoHarvest')].filter(Boolean).join(' · ')}));
      b.append(h,plateGrid(treatWellMap(tr),tr.groups||[],false));
      b.onclick=x=>{x.stopPropagation();openDetail(tr.id);};card.append(b);});
    const acts=document.createElement('div');acts.className='inc-acts';
    const btn=(label,fn)=>{const x=document.createElement('button');x.type='button';x.className='mini';x.textContent=label;x.onclick=ev=>{ev.stopPropagation();fn();};acts.append(x);};
    if(trs.length)btn(t('harvestProtein'),()=>openProtein(trs[0].id));
    else if(c.purpose==='treat')btn('Treat',()=>openTreat(c.cid));
    btn('Passage',()=>openPassage({source:c.cid}));
    card.append(acts);
    const src=all.find(e=>e.id===c.src);
    card.onclick=()=>{if(src)openDetail(src.id);};card.onkeydown=x=>{if(x.key==='Enter'&&x.target===card&&src)openDetail(src.id);};
    cl.append(card);}
}

const CK_SCREEN={sManual:'count',sStart:'count',sPassage:'passage',sTreat:'treat',sProtein:'protein'};
function ckText(kind){const ev=allEvents().filter(e=>e.type==='checklist'&&e.kind===kind).pop();return {text:ev?ev.text:CK_DEFAULT[kind],draft:!ev};}
function ckParse(text){const out=[];let sec=null;for(let l of String(text).split('\n')){l=l.trim();if(!l)continue;
  if(l.startsWith('#')){sec={h:l.replace(/^#+\s*/,''),items:[]};out.push(sec);continue;}
  if(!sec){sec={h:'',items:[]};out.push(sec);}sec.items.push(l.replace(/^([-•*]|\d+[.)])\s*/,''));}return out;}
const ckKey=kind=>`cc.ck.${kind}.${new Date().toDateString()}`;
function paintChecklist(scr){const kind=CK_SCREEN[scr],box=$('ck_'+scr);if(!box)return;
  const {text,draft}=ckText(kind),secs=ckParse(text),done=store.get(ckKey(kind),{});const wasOpen=box.open;box.innerHTML='';
  let n=0,d=0;const sum=document.createElement('summary');box.append(sum);
  for(const s of secs){if(s.h)box.append(Object.assign(document.createElement('h3'),{className:'ck-h',textContent:s.h}));
    s.items.forEach(it=>{const k=(s.h+'|'+it).slice(0,160);n++;if(done[k])d++;
      const lab=document.createElement('label');lab.className='ck-item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[k];
      cb.onchange=()=>{const cur=store.get(ckKey(kind),{});if(cb.checked)cur[k]=1;else delete cur[k];store.set(ckKey(kind),cur);paintChecklist(scr);};
      lab.append(cb,Object.assign(document.createElement('span'),{textContent:it}));box.append(lab);});}
  sum.innerHTML='<span class="ck-t"></span><span class="ck-n"></span>';sum.querySelector('.ck-t').textContent=t('ckTitle')+(draft?` · ${t('ckDraft')}`:'');
  sum.querySelector('.ck-n').textContent=t('ckOf',d,n);box.classList.toggle('all-done',n>0&&d===n);
  const row=document.createElement('div');row.className='ck-row';
  const clr=document.createElement('button');clr.type='button';clr.className='mini';clr.textContent=t('ckClear');clr.onclick=()=>{store.del(ckKey(kind));paintChecklist(scr);};
  const ed=document.createElement('button');ed.type='button';ed.className='mini';ed.textContent=t('ckEdit');ed.onclick=()=>editChecklist(scr);
  const pdfb=document.createElement('button');pdfb.type='button';pdfb.className='mini';pdfb.textContent=t('pdf');pdfb.onclick=()=>printChecklist(kind);
  row.append(clr,ed,pdfb);box.append(row);box.open=wasOpen;}
function editChecklist(scr){const kind=CK_SCREEN[scr],box=$('ck_'+scr);if(box.querySelector('textarea'))return;
  const f=document.createElement('div');f.className='ck-edit';const ta=document.createElement('textarea');ta.rows=12;ta.value=ckText(kind).text;ta.setAttribute('aria-label',t('ckTitle'));
  const help=Object.assign(document.createElement('span'),{className:'ck-help',textContent:t('ckHelp')});
  const row=document.createElement('div');row.className='row2';const c=document.createElement('button');c.type='button';c.className='btn';c.textContent=t('cancel');
  const s=document.createElement('button');s.type='button';s.className='btn primary';s.style.cssText='min-height:48px;font-size:15px';s.textContent=t('ckSave');
  c.onclick=()=>f.remove();s.onclick=()=>{const tx=ta.value.trim();if(!tx)return;addEvent({type:'checklist',kind,title:`${t('ckTitle')} · ${kind}`,text:tx});f.remove();setTimeout(()=>paintChecklist(scr),50);};
  row.append(c,s);f.append(help,ta,row);box.append(f);ta.focus();}
for(const scr of Object.keys(CK_SCREEN)){const host=$(scr).querySelector('.form')||$(scr).querySelector('.start-main');if(!host)continue;

  grNow:(n,p)=>`Now ~${n} cells · ~${p}% of confluent`,grReach:(p,d)=>`Reaches ${p}% around ${d}`,grPast:p=>`Probably past ${p}% · time to passage`,
  grNoN0:'Seeding number unknown, so no prediction',grSettings:'Growth settings',grDoubling:'Doubling time (h)',grLag:'Lag after seeding (h)',
  grPassAt:'Passage at (%)',grSave:'Save',grDefault:'Default 24 h is a placeholder, not measured. Set it for your cells',grSaved:'Current values',
  grDue:(n,d)=>`Passage soon · ${n} · reaches the threshold around ${d}`,grEst:'estimate'
