/* rough cells per well/dish/flask at 100% confluence (reference values for a typical adherent line) */
const CAP={'6-well':1.2e6,'12-well':0.5e6,'24-well':0.24e6,'96-well':0.04e6,'dish-35':1.2e6,'dish-60':3.2e6,'dish-100':8.8e6,'T25':2.8e6,'T75':8.4e6,'T175':1.86e7};
function growthSet(line){const ev=allEvents().filter(e=>e.type==='growth'&&(!e.line||e.line===line)).pop();
  return ev?{doubling_h:+ev.doubling_h,lag_h:+ev.lag_h,passage_pct:+ev.passage_pct,saved:true}:{doubling_h:24,lag_h:24,passage_pct:80,saved:false};}
function predict(c,now=Date.now()){const n0=num(c.cells),cap=CAP[c.vessel];if(!(n0>0)||!cap)return null;
  const g=growthSet(c.line),h=(now-new Date(c.created))/3.6e6,n=n0*2**(Math.max(0,h-g.lag_h)/g.doubling_h),pct=Math.min(100,n/cap*100);
  const target=g.passage_pct/100*cap,hT=n0>=target?0:g.lag_h+g.doubling_h*Math.log2(target/n0);
  return {n:Math.min(n,cap),pct,at:new Date(new Date(c.created).getTime()+hT*3.6e6),g};}
function growthRow(c){const r=document.createElement('div');r.className='gr';const p=predict(c);
  if(!p){r.classList.add('muted');r.textContent=t('grNoN0');return r;}
  const bar=document.createElement('div');bar.className='gr-bar';const fill=document.createElement('span');fill.style.width=p.pct.toFixed(0)+'%';
  if(p.pct>=p.g.passage_pct)fill.classList.add('hot');bar.append(fill);
  const mk=document.createElement('i');mk.style.left=p.g.passage_pct+'%';bar.append(mk);
  const tx=document.createElement('span');tx.className='gr-t';
  tx.textContent=t('grNow',sciShort(p.n),p.pct<1?'<1':p.pct.toFixed(0))+'\n'+(p.pct>=p.g.passage_pct?t('grPast',p.g.passage_pct):t('grReach',p.g.passage_pct,shortDate(p.at)))+` (${t('grEst')})`;
  r.append(bar,tx);return r;}
function soonToPassage(){const now=Date.now();return activeCultures().filter(c=>c.status==='active'&&c.purpose!=='treat').map(c=>({c,p:predict(c,now)}))
  .filter(x=>x.p&&x.p.at-now<12*3.6e6);}
function openGrowthBox(){const host=$('cultList');if(host.querySelector('.gr-box'))return;const line=activeCultures()[0]?.line||'Hep-55.1C',g=growthSet(line);
  const f=document.createElement('div');f.className='box gr-box';
  f.innerHTML=`<b style="font-size:14px"></b><span class="ck-help"></span><div class="row2"><div class="field"><label for="grD"></label><input id="grD" class="mono" inputmode="decimal"></div><div class="field"><label for="grL"></label><input id="grL" class="mono" inputmode="decimal"></div></div><div class="field"><label for="grP"></label><input id="grP" class="mono" inputmode="decimal"></div><div class="row2"><button type="button" class="btn"></button><button type="button" class="btn primary" style="min-height:48px;font-size:15px"></button></div>`;
  f.querySelector('b').textContent=`${t('grSettings')} · ${line}`;f.querySelector('.ck-help').textContent=g.saved?t('grSaved'):t('grDefault');
  [['grD','grDoubling',g.doubling_h],['grL','grLag',g.lag_h],['grP','grPassAt',g.passage_pct]].forEach(([id,k,v])=>{f.querySelector(`[for=${id}]`).textContent=t(k);f.querySelector('#'+id).value=v;});
  const [c,s]=f.querySelectorAll('.row2:last-child button');c.textContent=t('cancel');s.textContent=t('grSave');c.onclick=()=>f.remove();
  s.onclick=()=>{const d=num(f.querySelector('#grD').value),l=num(f.querySelector('#grL').value),p=num(f.querySelector('#grP').value);
    if(!(d>0)||!(l>=0)||!(p>0&&p<=100))return;addEvent({type:'growth',line,title:`${t('grSettings')} · ${line}`,doubling_h:d,lag_h:l,passage_pct:p});f.remove();};

const printRoot=(()=>{const r=document.createElement('div');r.id='printRoot';r.hidden=true;document.body.append(r);return r;})();
function printOut(title,sub,nodes,{hood=false}={}){
  printRoot.innerHTML='';printRoot.className=hood?'hood':'';
  const h=document.createElement('header');h.className='pr-head';
  h.append(Object.assign(document.createElement('h1'),{textContent:title}));
  const meta=[sub,me()?`${t('dOwner')}: ${me()}`:'',t('printedAt',niceDate(new Date()))].filter(Boolean).join(' · ');
  h.append(Object.assign(document.createElement('p'),{textContent:meta}));printRoot.append(h);
  for(const n of nodes)printRoot.append(n);
  printRoot.hidden=false;document.title=title;toast(t('pdfHint'),false);
  const imgs=[...printRoot.querySelectorAll('img')].filter(i=>!i.complete);
  Promise.all(imgs.map(i=>new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,4000);}))).then(()=>setTimeout(()=>window.print(),150));
}
window.addEventListener('afterprint',()=>{printRoot.hidden=true;printRoot.innerHTML='';document.title='Cell Lab';});
const KIND_NAME=k=>t({count:'evCount',passage:'evPassage',treat:'evTreat',protein:'evProtein'}[k]||'evNote');
function checklistNode(kind){const {text}=ckText(kind),sec=document.createElement('section');sec.className='pr-ck';
  sec.append(Object.assign(document.createElement('h2'),{textContent:`${t('pdfCkTitle')} · ${KIND_NAME(kind)}`}));
  for(const s of ckParse(text)){if(s.h)sec.append(Object.assign(document.createElement('h3'),{textContent:s.h}));
    const ol=document.createElement('ol');s.items.forEach((it,i)=>{const li=document.createElement('li');li.append(Object.assign(document.createElement('span'),{className:'bx'}),Object.assign(document.createElement('span'),{className:'n',textContent:(i+1)+'.'}),Object.assign(document.createElement('span'),{textContent:it}));ol.append(li);});sec.append(ol);}
  const ev=allEvents().filter(e=>e.type==='checklist'&&e.kind===kind).pop();
  if(ev&&ev.photos&&ev.photos.length){const g=document.createElement('div');g.className='pr-photos';ev.photos.forEach(id=>{const im=new Image();im.src=photoUrl(id);g.append(im);});sec.append(g);}
  return sec;}
function printChecklist(kind){printOut(`${t('pdfCkTitle')} · ${KIND_NAME(kind)}`,'Hep-55.1C',[checklistNode(kind)],{hood:true});}
function printAllChecklists(){printOut(t('pdfCkTitle'),'Hep-55.1C',['count','passage','treat','protein'].map(checklistNode),{hood:true});}
function printDetail(){const e=evById(dId);if(!e)return;const c=$('dBody').cloneNode(true);
  c.querySelectorAll('.d-acts,button.btn,.bca-box,.gr-box').forEach(x=>x.remove());
  c.querySelectorAll('button.d-link').forEach(b=>{const s=document.createElement('div');s.className='d-link';s.innerHTML=b.innerHTML;b.replaceWith(s);});
  c.querySelectorAll('a').forEach(a=>{const s=document.createElement('span');s.append(...a.childNodes);a.replaceWith(s);});
  c.className='d-body pr-detail';printOut($('dTitle').textContent,niceDate(new Date(e.at)),[c]);}
function printLog(){const c=$('logList').cloneNode(true);c.removeAttribute('id');c.querySelectorAll('.acts,.box').forEach(x=>x.remove());
  c.querySelectorAll('a').forEach(a=>{const s=document.createElement('span');s.append(...a.childNodes);a.replaceWith(s);});
  c.className='pr-log';const f=[...$('logFilters').querySelectorAll('button[aria-pressed="true"]')].map(b=>b.textContent).join(' · ');
  printOut(t('pdfLogTitle'),f,[c]);}

  ['hood',/hood|blower|พัดลม/],['vacuum',/เครื่องดูด|vacuum/],['spray',/ethanol|เช็ด|สเปรย์/],['fire',/ตะเกียง|แก๊ส|ลนไฟ/],['count',/hemocytometer|นับ/],['calc',/คำนวณ|cells\/ml|ปริมาตร cell/],
  ['shake',/เขย่า/],['tag',/ฉลาก/],['fridge',/ตู้เย็น|−80|-80|เก็บที่/],['scrape',/ขูด|scraper/],['wash',/ล้าง/],['ice',/น้ำแข็ง|เย็น/],['phone',/แอป|บันทึก/],
  ['plate',/6-well|หลุม|well|ผัง/],['dish',/dish|จาน/],['mix',/ผสม|lysis|buffer|trypan|หลอด \d|µm:/],['tube',/tube|หลอด/],['pipette',/ดูด|pipette|ใส่|resuspend|หยด/],['bottle',/trypsin|pbs|media|medium|dmso|stock/]];
const icOne=s=>{s=String(s).toLowerCase();for(const [k,re] of IC_RULES)if(re.test(s))return k;return null;};
const icFor=(title,detail='')=>icOne(title)||icOne(detail)||'check';
const svgIc=(k,size=22)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||IC.check}</svg>`;
const HL=new RegExp(['(?<temp>[-−]?\\d+(?:\\.\\d+)?\\s?°C)','(?<rpm>\\d[\\d,]*\\s?rpm)','(?<time>\\d+(?:\\s?[–-]\\s?\\d+)?\\s?(?:นาที|ชม\\.|ชั่วโมง|วินาที|min\\b))',
  '(?<vol>\\d[\\d,]*(?:\\.\\d+)?\\s?(?:µL|uL|mL))','(?<conc>\\d[\\d,]*(?:\\.\\d+)?\\s?(?:µM|mM))','(?<cells>\\d[\\d,]*(?:\\s?[–-]\\s?\\d[\\d,]*)?\\s?เซลล์)'].join('|'),'g');
const hl=s=>esc(s).replace(HL,(m,...a)=>{const g=a[a.length-1];const k=Object.keys(g).find(x=>g[x]!==undefined);return `<mark class="k ${k}">${m}</mark>`;});
function guideParse(text){const out=[];let sec=null,last=null;
  for(let l of String(text).split('\n')){l=l.trim();if(!l)continue;
    if(l.startsWith('#')){sec={h:l.replace(/^#+\s*/,''),steps:[]};out.push(sec);last=null;continue;}
    if(!sec){sec={h:'',steps:[]};out.push(sec);}
    if((l.startsWith('!')||l.startsWith('>'))&&last){(l[0]==='!'?last.warn:last.tip).push(l.slice(1).trim());continue;}
    let timer=null;l=l.replace(/\s*⏱\s*(\d+(?:\.\d+)?)\s*/,(m,n)=>{timer=+n;return ' ';}).trim();
    const [title,...rest]=l.replace(/^([-•*]|\d+[.)])\s*/,'').split(/\s+\|\s+/);
    last={title,detail:rest.join(' · '),warn:[],tip:[],timer,key:(sec.h+'|'+title).slice(0,160)};sec.steps.push(last);}
  return out;}
/* ---------- timers (one at a time, shown on every screen) ---------- */
const TMR={end:0,label:'',iv:null};
function startTimer(min,label){TMR.end=Date.now()+min*6e4;TMR.label=label;clearInterval(TMR.iv);TMR.iv=setInterval(tickTimer,500);tickTimer();
  try{const AC=window.AudioContext||window.webkitAudioContext;TMR.ac=TMR.ac||new AC();TMR.ac.resume();}catch(e){}}
function stopTimer(){clearInterval(TMR.iv);TMR.end=0;$('timerPill').hidden=true;paintStepTimer();}
function beep(){try{const ac=TMR.ac;if(!ac)return;[0,.35,.7].forEach(dt=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.25,ac.currentTime+dt);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dt+.3);o.start(ac.currentTime+dt);o.stop(ac.currentTime+dt+.3);});}catch(e){}}
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${pad2(s%60)}`;};
function tickTimer(){const left=TMR.end-Date.now();const p=$('timerPill');
  if(TMR.end&&left<=0){clearInterval(TMR.iv);TMR.end=0;p.hidden=true;beep();try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);}catch(e){}toast(t('gdTimerDone',TMR.label),true);paintStepTimer();return;}
  p.hidden=false;p.querySelector('b').textContent=mmss(left);p.querySelector('span').textContent=TMR.label;paintStepTimer();}
/* ---------- rendering ---------- */
function stepCard(st,i,kind,done,{print=false,onTick}={}){
  const c=document.createElement('div');c.className='stp'+(done?' done':'');const ic=icFor(st.title,st.detail);
  c.innerHTML=`<label class="stp-cb"><input type="checkbox"${done?' checked':''}${print?' disabled':''}><span class="bx"></span></label>
    <span class="stp-ic ic-${ic}">${svgIc(ic)}<i>${i}</i></span><div class="stp-tx"><b>${hl(st.title)}</b>${st.detail?`<span>${hl(st.detail)}</span>`:''}</div>`;
  const tx=c.querySelector('.stp-tx');
  for(const w of st.warn){const d=document.createElement('div');d.className='stp-warn';d.innerHTML=`${svgIc('warn',16)}<span>${hl(w)}</span>`;tx.append(d);}
  for(const w of st.tip){const d=document.createElement('div');d.className='stp-tip';d.innerHTML=`${svgIc('tip',16)}<span>${hl(w)}</span>`;tx.append(d);}
  if(st.timer&&!print){const b=document.createElement('button');b.type='button';b.className='stp-timer';b.innerHTML=`${svgIc('timer',16)}<span>${esc(t('gdTimer',st.timer))}</span>`;
    b.onclick=()=>startTimer(st.timer,st.title);tx.append(b);}
  if(onTick)c.querySelector('input').onchange=e=>onTick(e.target.checked);
  return c;}
function guideNodes(kind,{print=false,onChange}={}){const {text}=ckText(kind),secs=guideParse(text),done=print?{}:store.get(ckKey(kind),{});const frag=[];let i=0;
  for(const s of secs){const sec=document.createElement('section');sec.className='gd-sec';
    if(s.h){const h=document.createElement('h3');h.className='gd-h';h.innerHTML=`<span class="gd-hic">${svgIc(icFor(s.h),18)}</span><span>${esc(s.h)}</span>`;sec.append(h);}
    for(const st of s.steps){i++;sec.append(stepCard(st,i,kind,!!done[st.key],{print,onTick:v=>{const cur=store.get(ckKey(kind),{});if(v)cur[st.key]=1;else delete cur[st.key];store.set(ckKey(kind),cur);onChange&&onChange();}}));}
    frag.push(sec);}
  const ev=allEvents().filter(e=>e.type==='checklist'&&e.kind===kind).pop();
  if(ev&&ev.photos&&ev.photos.length){const s=document.createElement('section');s.className='gd-sec gd-photos';
    s.innerHTML=`<h3 class="gd-h"><span class="gd-hic">${svgIc('tag',18)}</span><span>${esc(t('gdPhotos'))}</span></h3>`;
    const g=document.createElement('div');g.className='d-photos';ev.photos.forEach(id=>{const a=document.createElement('a');a.href=photoUrl(id);a.target='_blank';a.rel='noopener';
      const im=new Image();im.src=photoUrl(id);im.alt='';a.append(im);g.append(a);});s.append(g);frag.push(s);}
  return frag;}
const guideCount=kind=>guideParse(ckText(kind).text).reduce((a,s)=>a+s.steps.length,0);
/* checklist box inside the forms: same illustrated steps */
function paintChecklist(scr){const kind=CK_SCREEN[scr],box=$('ck_'+scr);if(!box)return;
  const {draft}=ckText(kind),done=store.get(ckKey(kind),{}),wasOpen=box.open;box.innerHTML='';
  const steps=guideParse(ckText(kind).text).flatMap(s=>s.steps),n=steps.length,d=steps.filter(s=>done[s.key]).length;
  const sum=document.createElement('summary');sum.innerHTML='<span class="ck-t"></span><span class="ck-n"></span>';
  sum.querySelector('.ck-t').textContent=t('ckTitle')+(draft?` · ${t('ckDraft')}`:'');sum.querySelector('.ck-n').textContent=t('ckOf',d,n);box.append(sum);
  box.classList.toggle('all-done',n>0&&d===n);
  const tools=document.createElement('div');tools.className='gd-tools';
  const mk=(label,fn,cls='mini')=>{const b=document.createElement('button');b.type='button';b.className=cls;b.textContent=label;b.onclick=fn;tools.append(b);};
  mk('▶ '+t('gdStepMode'),()=>openStepMode(kind),'mini primary-mini');mk(t('pdf'),()=>printChecklist(kind));mk(t('ckEdit'),()=>editChecklist(scr));mk(t('ckClear'),()=>{store.del(ckKey(kind));paintChecklist(scr);});
  box.append(tools);guideNodes(kind,{onChange:()=>paintChecklist(scr)}).forEach(x=>box.append(x));box.open=wasOpen;}
/* ---------- protocols screen ---------- */
let gdKind='passage';
function openGuide(kind){if(kind)gdKind=kind;paintGuide();show('sGuide');}
function paintGuide(){const seg=$('gdSeg');seg.innerHTML='';
  for(const k of ['passage','count','treat','protein']){const b=document.createElement('button');b.type='button';b.textContent=KIND_NAME(k);b.setAttribute('aria-pressed',gdKind===k);b.onclick=()=>{gdKind=k;paintGuide();};seg.append(b);}
  const steps=guideParse(ckText(gdKind).text).flatMap(s=>s.steps),done=store.get(ckKey(gdKind),{});
  $('gdCount').textContent=`${t('gdSteps',steps.length)} · ${t('ckOf',steps.filter(s=>done[s.key]).length,steps.length)}`;
  const body=$('gdBody');body.innerHTML='';guideNodes(gdKind,{onChange:paintGuide}).forEach(x=>body.append(x));}
/* ---------- step-by-step mode ---------- */
const SM={kind:null,i:0,steps:[],lock:null};
async function openStepMode(kind){SM.kind=kind;SM.steps=guideParse(ckText(kind).text).flatMap(s=>s.steps.map(st=>({...st,sec:s.h})));
  const done=store.get(ckKey(kind),{});SM.i=Math.max(0,SM.steps.findIndex(s=>!done[s.key]));if(SM.i<0)SM.i=0;
  $('stepMode').hidden=false;document.body.classList.add('sm-open');paintStep();
  try{SM.lock=await navigator.wakeLock?.request('screen');}catch(e){}}
function closeStepMode(){$('stepMode').hidden=true;document.body.classList.remove('sm-open');try{SM.lock&&SM.lock.release();}catch(e){}SM.lock=null;
  for(const scr of Object.keys(CK_SCREEN))paintChecklist(scr);if(!$('sGuide').hidden)paintGuide();}
function paintStep(){const st=SM.steps[SM.i],n=SM.steps.length,done=store.get(ckKey(SM.kind),{});if(!st)return;
  $('smKind').textContent=`${t('pdfCkTitle')} · ${KIND_NAME(SM.kind)}`;$('smProg').style.width=((SM.i+1)/n*100)+'%';
  $('smOf').textContent=t('gdStepOf',SM.i+1,n);$('smSec').textContent=st.sec||'';
  const ic=icFor(st.title,st.detail);$('smIcon').className='sm-icon ic-'+ic+' anim-'+ic;$('smIcon').innerHTML=svgIc(ic,64);
  $('smTitle').innerHTML=hl(st.title);$('smDetail').innerHTML=st.detail?hl(st.detail):'';$('smDetail').hidden=!st.detail;
  const ex=$('smExtra');ex.innerHTML='';
  for(const w of st.warn){const d=document.createElement('div');d.className='stp-warn big';d.innerHTML=`${svgIc('warn',22)}<span>${hl(w)}</span>`;ex.append(d);}
  for(const w of st.tip){const d=document.createElement('div');d.className='stp-tip big';d.innerHTML=`${svgIc('tip',22)}<span>${hl(w)}</span>`;ex.append(d);}
  $('smDone').hidden=!done[st.key];$('smPrev').disabled=SM.i===0;
  $('smNext').textContent=SM.i===n-1?'✓ '+t('gdDone'):'✓ '+t('gdNext');paintStepTimer();}
function paintStepTimer(){const box=$('smTimer');if(!box||$('stepMode').hidden)return;const st=SM.steps[SM.i];box.innerHTML='';if(!st||!st.timer)return;
  const running=TMR.end&&TMR.label===st.title;const b=document.createElement('button');b.type='button';b.className='sm-tbtn'+(running?' run':'');
  if(running){const left=TMR.end-Date.now(),frac=Math.max(0,left/(st.timer*6e4));
    b.innerHTML=`<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="24" fill="none" stroke="#E8ECF3" stroke-width="6"/><circle cx="28" cy="28" r="24" fill="none" stroke="#E0803A" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(150.8*frac).toFixed(1)} 150.8" transform="rotate(-90 28 28)"/></svg><span><b>${mmss(left)}</b><small>${esc(t('gdStop'))}</small></span>`;
    b.onclick=()=>stopTimer();}
  else{b.innerHTML=`${svgIc('timer',28)}<span><b>${esc(t('gdTimer',st.timer))}</b></span>`;b.onclick=()=>startTimer(st.timer,st.title);}
  box.append(b);}
$('smClose').onclick=closeStepMode;
$('smPrev').onclick=()=>{if(SM.i>0){SM.i--;paintStep();}};
$('smNext').onclick=()=>{const st=SM.steps[SM.i],cur=store.get(ckKey(SM.kind),{});cur[st.key]=1;store.set(ckKey(SM.kind),cur);
  if(SM.i<SM.steps.length-1){SM.i++;paintStep();}else closeStepMode();};
$('timerPill').onclick=()=>{if(confirmTwice('timer'))stopTimer();};
document.addEventListener('keydown',e=>{if($('stepMode').hidden)return;if(e.key==='ArrowRight')$('smNext').click();if(e.key==='ArrowLeft')$('smPrev').click();if(e.key==='Escape')closeStepMode();});
$('goGuide').onclick=()=>openGuide();
$('gdStep').onclick=()=>openStepMode(gdKind);$('gdPdf').onclick=()=>printChecklist(gdKind);
/* ---------- printing: same illustrated steps; wait for every photo ---------- */
function checklistNode(kind){const sec=document.createElement('section');sec.className='pr-ck';
  sec.append(Object.assign(document.createElement('h2'),{textContent:`${t('pdfCkTitle')} · ${KIND_NAME(kind)}`}));
  guideNodes(kind,{print:true}).forEach(x=>sec.append(x));return sec;}
function printOut(title,sub,nodes,{hood=false}={}){
  printRoot.innerHTML='';printRoot.className=hood?'hood':'';
  const h=document.createElement('header');h.className='pr-head';
  h.append(Object.assign(document.createElement('h1'),{textContent:title}));
  h.append(Object.assign(document.createElement('p'),{textContent:[sub,me()?`${t('dOwner')}: ${me()}`:'',t('printedAt',niceDate(new Date()))].filter(Boolean).join(' · ')}));
  printRoot.append(h);for(const n of nodes)printRoot.append(n);printRoot.hidden=false;document.title=title;toast(t('pdfHint'),false);
  const imgs=[...printRoot.querySelectorAll('img')];
  imgs.forEach(i=>{i.loading='eager';i.decoding='sync';const s=i.getAttribute('src');if(s){i.removeAttribute('src');i.src=s;}});
  const ready=i=>i.complete&&i.naturalWidth>0?Promise.resolve():new Promise(r=>{i.addEventListener('load',r,{once:true});i.addEventListener('error',r,{once:true});});
  Promise.race([Promise.all(imgs.map(i=>ready(i).then(()=>i.decode?i.decode().catch(()=>{}):0))),new Promise(r=>setTimeout(r,10000))])
    .then(()=>setTimeout(()=>window.print(),250));
}

function labBoot(){
  if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
  paintChecklists();paintMe();show('sHome');syncLab();setInterval(syncLab,60000);
}

/* ---------------- boot ---------------- */
applyLang(); paintLayout(); paintPill(); ping(); setInterval(ping,60000); loadRecent(); checkResume(); setTool('add'); labBoot();
})();
</script>
